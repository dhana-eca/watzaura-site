name: Waitlist digest

# Emails the week's early-access requests to hello@watzaura.com by calling the
# site's own digest endpoint. Needs the DIGEST_SECRET repository secret to
# match the DIGEST_SECRET env var on Render, and a real RESEND_API_KEY there.
on:
  schedule:
    - cron: "5 21 * * 0" # Mondays 08:05 Melbourne (AEDT)
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger digest
        env:
          DIGEST_SECRET: ${{ secrets.DIGEST_SECRET }}
        run: |
          set -euo pipefail
          test -n "$DIGEST_SECRET" || { echo "DIGEST_SECRET secret is not set"; exit 1; }
          code=$(curl -sS -o body.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $DIGEST_SECRET" \
            -H "Content-Type: application/json" -d "{}" \n            "https://watzaura.com/api/waitlist/digest?days=7")
          echo "HTTP $code"; cat body.json; echo
          test "$code" = "200"
