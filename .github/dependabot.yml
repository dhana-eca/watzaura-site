version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Australia/Melbourne
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      tooling:
        patterns: ["*"]
        exclude-patterns: ["astro", "@astrojs/*"]
    open-pull-requests-limit: 5
    # Major versions of the framework and toolchain are deliberate upgrades,
    # not Monday-morning bumps (Astro 5 → 7 changes the compiler and Markdown
    # pipeline). Dependabot proposes minors and patches only.
    ignore:
      - dependency-name: "astro"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@astrojs/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tailwindcss/vite"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
